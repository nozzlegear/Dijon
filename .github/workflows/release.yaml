---
name: Release Pipeline

on:
  workflow_dispatch:
    branches: [ main ]

env:
  REGISTRY: "ghcr.io"
  BUILD_IMAGE_NAME: "ghcr.io/nozzlegear/dijon:${{ github.run_number }}"
  LATEST_IMAGE_NAME: "ghcr.io/nozzlegear/dijon:latest"

jobs:
  build:
    name: "Build container"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push_image.outputs.digest }}
    steps:
    - name: Checkout branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Log in to GitHub Container Registry
      env:
        ACTOR: ${{ github.actor }}
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} -u "$ACTOR" --password-stdin

    - name: Setup justfile
      uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
      with:
        tool: just@1.58.0

    - name: Build container image
      id: build_image
      run: just build "${{ github.run_number }}" "${{ github.sha }}"

    - name: Push container images to registry
      run: |
        podman push "$BUILD_IMAGE_NAME"
        podman push "$LATEST_IMAGE_NAME"

    - name: Get manifest digest
      id: push_image
      run: |
        DIGEST=$(just get-digest "${{ github.run_number }}")
        echo "digest=$DIGEST" >> $GITHUB_OUTPUT

  deploy:
    name: "Deploy to host"
    runs-on: ubuntu-latest
    environment: "Host Deployment Environment"
    needs: [build]
    permissions:
      contents: write
      packages: read
    steps:
    - name: Checkout branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup justfile
      uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
      with:
        tool: just@1.46.0

    - name: Setup SOPS
      uses: nhedger/setup-sops@18e52f363488ed469d2e1855e542a1c651743bba # v3.0.0
      with:
        version: 3.12.2

    - name: Setup Pkl CLI
      uses: deezapps-fam/install-pkl@53cb175aaee7fd70c5963b66c756fd750652bdae # v1.0.1
      with:
        version: '0.30.2'

    - name: Setup SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
      run: |
        install -m 700 -d ~/.ssh
        install -m 600 /dev/null ~/.ssh/id_rsa
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        printf '%s %s %s\n' "$SSH_HOST" "ecdsa-sha2-nistp256" "$SSH_HOST_KEY" >> ~/.ssh/known_hosts

    - name: Generate quadlet files
      env:
        IMAGE_REF: ${{ env.BUILD_IMAGE_NAME }}@${{ needs.build.outputs.digest }}
      run: just pkl prod "$IMAGE_REF" /tmp/quadlets/

    - name: Deploy quadlet files to host
      run: just deploy-quadlets "${{secrets.SSH_USERNAME}}@${{ secrets.SSH_HOST }}" /tmp/quadlets/

    - name: Decrypt env.production.json
      env:
        SOPS_AGE_KEY_FILE: /tmp/sops_age_key_file.txt
      run: |
        printf '%s' ${{ secrets.SOPS_AGE_KEY }} > $SOPS_AGE_KEY_FILE
        sops decrypt env.production.json > /tmp/appsettings.secrets.json
        rm $SOPS_AGE_KEY_FILE

    - name: Deploy decrypted secrets to host
      run: just deploy-secrets "${{secrets.SSH_USERNAME}}@${{ secrets.SSH_HOST }}" /tmp/appsettings.secrets.json

    - name: Reload systemd and restart services
      run: just restart-systemd "${{secrets.SSH_USERNAME}}@${{ secrets.SSH_HOST }}"
